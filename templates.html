<div id="template" style="display: none">
  <div>
    <div class="code">
      <ul class="navbar-code" role="tablist" aria-label="Éditeurs de code">
        <li role="presentation"><a href="#intro" role="tab" class="btn btn-outline-dark"><i class="fas fa-info-circle"></i> <span>INTRO</span></a></li>
        <li role="presentation" class="active">
          <a href="#html" role="tab" class="btn btn-outline-success"><i class="fab fa-html5"></i> <span>HTML</span></a>
        </li>
        <li role="presentation"><a href="#css" role="tab" class="btn btn-outline-info"><i class="fab fa-css3-alt"></i> <span>CSS</span></a></li>
        <li role="presentation"><a href="#js" role="tab" class="btn btn-outline-warning"><i class="fab fa-js-square"></i> <span>JS</span></a></li>
      </ul>
      <div class="container-code">
        <div class="intro"></div>
        <div class="html">
          <textarea></textarea>
        </div>
        <div class="css">
          <textarea></textarea>
        </div>
        <div class="js">
          <textarea></textarea>
        </div>
      </div>
    </div>
    <div class="resizer"></div>
    <div class="renderer">
      <ul class="navbar-renderer">
        <li><a href="#run" class="run btn btn-outline-danger"><i class="fas fa-play"></i> <span>RUN</span></a></li>
        <li>
          <a href="#reset" class="reset btn btn-outline-danger"><i class="fas fa-undo"></i> <span>RESET</span></a>
        </li>
        <li>
          <a href="#libs" class="libs btn btn-outline-danger"><i class="fas fa-cube"></i> <span>Libs</span></a>
        </li>
        <li>
          <a href="#console" class="btn-console btn btn-outline-primary"><i class="fas fa-terminal"></i> <span class="console-label">Console</span></a>
        </li>
      </ul>
      <div class="container-renderer">
        <!-- <iframe  frameborder="0"></iframe> -->
      </div>
    </div>
  </div>
</div>

<div class="outer" style="display:none">
  <div class="inner">
    <ul class="navbar">
      <li><button class=" btn btn-info close p-2">X</button></li>
      <li><button class="addlibs btn btn-outline-info">Add</button></li>
    </ul>
    <div class="libraries">
      <div class="library" style="display:none">
        <div><input type="checkbox" class="sel" /> Selected</div>
        <div class="name"></div>
        <div class="url"></div>
        <div class="version"></div>
        <div><input type="checkbox" class="global" /> Global</div>
      </div>
    </div>
  </div>
</div>
<div id="top">
  <div id="progress" class="progress bg-danger">
    <div
      class="progress-bar bg-success"
      role="progressbar"
      aria-valuenow="25"
      aria-valuemin="0"
      aria-valuemax="100"
    ></div>
  </div>
  <div id="grad"></div>
</div>
<!-- <div id="tooltip"></div> -->
<div id="help">
  <a
    href="https://github.com/daaif/slides"
    class="btn btn-outline-success btn-sm"
    title="Code source"
    ><i class="fab fa-github"></i
  ></a>
  <a
    href="https://sp-slides.daaif.net/#0"
    class="btn btn-outline-success btn-sm"
    title="Documentation"
    ><i class="fas fa-info-circle"></i
  ></a>
  <a id="yt" class="btn btn-outline-danger btn-sm" title="Vidéo YouTube">
    <i class="fab fa-youtube"></i>
  </a>
  <a class="btn btn-outline-primary btn-sm close-excalidraw" onclick="toggleExcalidraw(event)" title="Tableau blanc">
    <i class="fas fa-pen-square"></i>
  </a>
  <a id="theme-toggle" class="btn btn-outline-secondary btn-sm" onclick="ThemeManager.toggle()" title="Changer de thème">
    <i class="fas fa-moon"></i>
  </a>
</div>
<iframe
  style="display: none;"
  id="ytIframe"
  src=""
  frameborder="0"
  allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
  allowfullscreen
></iframe>
<div id="ytOverlay" style="display:none"></div>
<div id="numSlides"></div>
